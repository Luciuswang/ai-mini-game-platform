<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻将精灵图调试工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #d4af37;
            text-align: center;
        }
        .sprite-preview {
            display: flex;
            gap: 30px;
            margin: 20px 0;
        }
        .grid-overlay {
            position: relative;
            width: 512px;
            height: 512px;
        }
        .grid-overlay img {
            width: 100%;
            height: 100%;
        }
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .grid-cell {
            position: absolute;
            border: 1px solid rgba(255,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: red;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            box-sizing: border-box;
        }
        .grid-cell:hover {
            background: rgba(255,255,0,0.3);
        }
        .grid-cell.selected {
            background: rgba(0,255,0,0.3);
            border-color: lime;
        }
        .grid-cell.mapped {
            background: rgba(100,149,237,0.3);
            border-color: cornflowerblue;
        }
        .grid-cell.mapped.selected {
            background: rgba(0,255,0,0.5);
        }
        .controls {
            background: #2d2d4d;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .control-row {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            align-items: center;
        }
        label {
            min-width: 80px;
        }
        input[type="number"] {
            width: 80px;
            padding: 5px;
        }
        .tile-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #2e7d32;
            padding: 20px;
            border-radius: 10px;
        }
        .tile {
            width: 50px;
            height: 70px;
            background-color: #f5f0e1;
            background-image: url('img/majiang.png');
            background-repeat: no-repeat;
            border: 2px solid #c9b896;
            border-radius: 6px;
        }
        .tile-label {
            text-align: center;
            font-size: 12px;
            margin-top: 5px;
        }
        .mapping-output {
            background: #0a0a15;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #d4af37;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #f4d03f;
        }
        .tile-info {
            background: #333;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🀄 麻将精灵图调试工具</h1>
        
        <div class="controls">
            <h3>网格设置</h3>
            <div class="control-row">
                <label>列数:</label>
                <input type="number" id="cols" value="8" min="1" max="20" onchange="updateGrid()">
                <label>行数:</label>
                <input type="number" id="rows" value="6" min="1" max="20" onchange="updateGrid()">
            </div>
        </div>
        
        <div class="sprite-preview">
            <div>
                <h3>原图（点击单元格选择位置）</h3>
                <div class="grid-overlay" id="gridOverlay">
                    <img src="img/majiang.png" alt="麻将精灵图" onerror="handleImageError(this)">
                    <div class="grid-lines" id="gridLines"></div>
                </div>
            </div>
            <div>
                <h3>牌位置映射</h3>
                <div class="tile-info" id="tileInfo">
                    点击左侧网格查看位置信息
                </div>
                <div id="mappingOutput" class="mapping-output">
// 精灵图位置映射生成中...
                </div>
            </div>
        </div>
        
        <h3>所有牌预览</h3>
        <div class="tile-preview" id="tilePreview"></div>
        
        <div class="controls">
            <button onclick="generateMapping()">生成位置映射代码</button>
            <button onclick="copyToClipboard()">复制代码</button>
            <button onclick="testAllTiles()">测试所有牌</button>
            <button onclick="assignSelectedToTile()">将选中位置分配给牌</button>
            <button onclick="clearMapping()">清空映射</button>
        </div>
    </div>

    <script>
        // ==================== 配置常量 ====================
        // 与 index.html 保持一致：8列×6行网格，512x512像素
        const SPRITE_CONFIG = {
            imageSize: 512,        // 精灵图尺寸（像素）
            cols: 8,               // 列数（与主游戏一致）
            rows: 6,               // 行数（与主游戏一致）
            // 用于预览牌的背景尺寸
            bgWidth: 400,          // 8列 × 50px
            bgHeight: 420          // 6行 × 70px
        };
        
        // ==================== 牌的定义 ====================
        const allTiles = [
            // 筒子
            { key: 'tong1', name: '一筒' }, { key: 'tong2', name: '二筒' },
            { key: 'tong3', name: '三筒' }, { key: 'tong4', name: '四筒' },
            { key: 'tong5', name: '五筒' }, { key: 'tong6', name: '六筒' },
            { key: 'tong7', name: '七筒' }, { key: 'tong8', name: '八筒' },
            { key: 'tong9', name: '九筒' },
            // 条子
            { key: 'tiao1', name: '一条' }, { key: 'tiao2', name: '二条' },
            { key: 'tiao3', name: '三条' }, { key: 'tiao4', name: '四条' },
            { key: 'tiao5', name: '五条' }, { key: 'tiao6', name: '六条' },
            { key: 'tiao7', name: '七条' }, { key: 'tiao8', name: '八条' },
            { key: 'tiao9', name: '九条' },
            // 万子
            { key: 'wan1', name: '一万' }, { key: 'wan2', name: '二万' },
            { key: 'wan3', name: '三万' }, { key: 'wan4', name: '四万' },
            { key: 'wan5', name: '五万' }, { key: 'wan6', name: '六万' },
            { key: 'wan7', name: '七万' }, { key: 'wan8', name: '八万' },
            { key: 'wan9', name: '九万' },
            // 字牌
            { key: 'zhong', name: '红中' }, { key: 'fa', name: '发财' },
            { key: 'bai', name: '白板' },
            { key: 'dong', name: '东风' }, { key: 'nan', name: '南风' },
            { key: 'xi', name: '西风' }, { key: 'bei', name: '北风' },
            // 花牌
            { key: 'chun', name: '春' }, { key: 'xia', name: '夏' },
            { key: 'qiu', name: '秋' }, { key: 'dong_hua', name: '冬' },
            { key: 'mei', name: '梅' }, { key: 'lan', name: '兰' },
            { key: 'zhu', name: '竹' }, { key: 'ju', name: '菊' }
        ];
        
        // ==================== 状态变量 ====================
        let cols = SPRITE_CONFIG.cols;
        let rows = SPRITE_CONFIG.rows;
        let selectedCell = null;
        
        // 牌位置映射（与 index.html 保持一致）
        // 布局（8列×6行）：
        // Row 0: 1万 2万 3万 4万 5万 6万 7万 8万
        // Row 1: 1筒 2筒 3筒 4筒 5筒 6筒 7筒 8筒
        // Row 2: 1条 2条 3条 4条 5条 6条 7条 8条
        // Row 3: 东 南 西 北 中 发 白 [空]
        // Row 4: 秋 兰 竹 梅 春 夏 冬 菊
        // Row 5: 9万 9筒 9条 ...
        let tileMapping = {
            // 第0行: 万子 1-8
            'wan1': [0, 0], 'wan2': [0, 1], 'wan3': [0, 2], 'wan4': [0, 3],
            'wan5': [0, 4], 'wan6': [0, 5], 'wan7': [0, 6], 'wan8': [0, 7],
            
            // 第1行: 筒子 1-8
            'tong1': [1, 0], 'tong2': [1, 1], 'tong3': [1, 2], 'tong4': [1, 3],
            'tong5': [1, 4], 'tong6': [1, 5], 'tong7': [1, 6], 'tong8': [1, 7],
            
            // 第2行: 条子 1-8
            'tiao1': [2, 0], 'tiao2': [2, 1], 'tiao3': [2, 2], 'tiao4': [2, 3],
            'tiao5': [2, 4], 'tiao6': [2, 5], 'tiao7': [2, 6], 'tiao8': [2, 7],
            
            // 第3行: 字牌 东南西北中发白
            'dong': [3, 0], 'nan': [3, 1], 'xi': [3, 2], 'bei': [3, 3],
            'zhong': [3, 4], 'fa': [3, 5], 'bai': [3, 6],
            
            // 第4行: 花牌 秋兰竹梅春夏冬菊
            'qiu': [4, 0], 'lan': [4, 1], 'zhu': [4, 2], 'mei': [4, 3],
            'chun': [4, 4], 'xia': [4, 5], 'dong_hua': [4, 6], 'ju': [4, 7],
            
            // 第5行: 9万 9筒 9条
            'wan9': [5, 0], 'tong9': [5, 1], 'tiao9': [5, 2]
        };
        
        function updateGrid() {
            // 输入验证
            const colsInput = parseInt(document.getElementById('cols').value);
            const rowsInput = parseInt(document.getElementById('rows').value);
            
            if (isNaN(colsInput) || colsInput < 1 || colsInput > 20) {
                alert('列数必须在 1-20 之间');
                document.getElementById('cols').value = cols;
                return;
            }
            if (isNaN(rowsInput) || rowsInput < 1 || rowsInput > 20) {
                alert('行数必须在 1-20 之间');
                document.getElementById('rows').value = rows;
                return;
            }
            
            cols = colsInput;
            rows = rowsInput;
            
            const gridLines = document.getElementById('gridLines');
            gridLines.innerHTML = '';
            
            const cellWidth = SPRITE_CONFIG.imageSize / cols;
            const cellHeight = SPRITE_CONFIG.imageSize / rows;
            
            // 使用 DocumentFragment 优化性能
            const fragment = document.createDocumentFragment();
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.style.left = (c * cellWidth) + 'px';
                    cell.style.top = (r * cellHeight) + 'px';
                    cell.style.width = cellWidth + 'px';
                    cell.style.height = cellHeight + 'px';
                    cell.textContent = `${r},${c}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.onclick = () => selectCell(r, c, cell);
                    fragment.appendChild(cell);
                }
            }
            
            gridLines.appendChild(fragment);
            
            // 高亮已分配的网格
            highlightMappedCells();
            
            // 更新预览
            testAllTiles();
        }
        
        // 高亮已分配映射的网格单元
        function highlightMappedCells() {
            // 构建已映射位置的集合
            const mappedPositions = new Set();
            Object.values(tileMapping).forEach(pos => {
                if (pos && Array.isArray(pos)) {
                    mappedPositions.add(`${pos[0]},${pos[1]}`);
                }
            });
            
            // 更新网格单元的样式
            document.querySelectorAll('.grid-cell').forEach(cell => {
                const key = `${cell.dataset.row},${cell.dataset.col}`;
                cell.classList.toggle('mapped', mappedPositions.has(key));
            });
        }
        
        function selectCell(row, col, element) {
            // 清除之前的选择
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedCell = [row, col];
            
            // 计算背景位置
            const bgX = -col * (SPRITE_CONFIG.bgWidth / cols);
            const bgY = -row * (SPRITE_CONFIG.bgHeight / rows);
            
            // 查找该位置对应的牌
            const tilesAtPosition = allTiles.filter(t => {
                const pos = tileMapping[t.key];
                return pos && pos[0] === row && pos[1] === col;
            });
            
            const info = document.getElementById('tileInfo');
            let infoHtml = `
                <strong>选中位置:</strong> [${row}, ${col}]<br>
                <strong>背景位置:</strong> ${bgX.toFixed(2)}px, ${bgY.toFixed(2)}px
            `;
            
            if (tilesAtPosition.length > 0) {
                infoHtml += `<br><strong>已分配的牌:</strong> ${tilesAtPosition.map(t => t.name).join(', ')}`;
            } else {
                infoHtml += `<br><em style="color: #888;">该位置未分配任何牌</em>`;
            }
            
            info.innerHTML = infoHtml;
        }
        
        function testAllTiles() {
            const preview = document.getElementById('tilePreview');
            preview.innerHTML = '';
            
            // 使用统一的映射数据
            const bgWidth = SPRITE_CONFIG.bgWidth;
            const bgHeight = SPRITE_CONFIG.bgHeight;
            
            // 使用 DocumentFragment 优化性能
            const fragment = document.createDocumentFragment();
            
            allTiles.forEach(tile => {
                const pos = tileMapping[tile.key];
                const container = document.createElement('div');
                container.style.textAlign = 'center';
                
                const div = document.createElement('div');
                div.className = 'tile';
                div.style.backgroundSize = `${bgWidth}px ${bgHeight}px`;
                
                if (pos && Array.isArray(pos) && pos.length === 2) {
                    const bgX = -pos[1] * (bgWidth / cols);
                    const bgY = -pos[0] * (bgHeight / rows);
                    div.style.backgroundPosition = `${bgX}px ${bgY}px`;
                } else {
                    div.style.background = '#ccc';
                    div.textContent = '?';
                }
                
                const label = document.createElement('div');
                label.className = 'tile-label';
                label.textContent = tile.name;
                
                container.appendChild(div);
                container.appendChild(label);
                fragment.appendChild(container);
            });
            
            preview.appendChild(fragment);
        }
        
        // 牌类型常量
        const TILE_CATEGORIES = {
            tong: { prefix: 'tong', label: '筒子 1-9' },
            tiao: { prefix: 'tiao', label: '条子 1-9' },
            wan: { prefix: 'wan', label: '万子 1-9' },
            honor: { keys: ['zhong', 'fa', 'bai', 'dong', 'nan', 'xi', 'bei'], label: '字牌' },
            flower: { keys: ['chun', 'xia', 'qiu', 'dong_hua', 'mei', 'lan', 'zhu', 'ju'], label: '花牌' }
        };
        
        // 生成单个类别的映射代码
        function generateCategoryCode(tiles, label) {
            const mappedTiles = tiles
                .map(t => {
                    const pos = tileMapping[t.key];
                    return pos ? `    '${t.key}': [${pos[0]}, ${pos[1]}]` : null;
                })
                .filter(Boolean);
            
            if (mappedTiles.length === 0) return '';
            return `    // ${label}\n${mappedTiles.join(',\n')}`;
        }
        
        function generateMapping() {
            const output = document.getElementById('mappingOutput');
            
            // 按类别分组
            const categories = [
                { tiles: allTiles.filter(t => t.key.startsWith('tong')), label: TILE_CATEGORIES.tong.label },
                { tiles: allTiles.filter(t => t.key.startsWith('tiao')), label: TILE_CATEGORIES.tiao.label },
                { tiles: allTiles.filter(t => t.key.startsWith('wan')), label: TILE_CATEGORIES.wan.label },
                { tiles: allTiles.filter(t => TILE_CATEGORIES.honor.keys.includes(t.key)), label: TILE_CATEGORIES.honor.label },
                { tiles: allTiles.filter(t => TILE_CATEGORIES.flower.keys.includes(t.key)), label: TILE_CATEGORIES.flower.label }
            ];
            
            // 生成代码
            const categoryCode = categories
                .map(cat => generateCategoryCode(cat.tiles, cat.label))
                .filter(Boolean)
                .join(',\n\n');
            
            const code = `// 麻将牌精灵图位置映射 [row, col]\nconst TILE_SPRITE_MAP = {\n${categoryCode}\n};`;
            
            output.textContent = code;
        }
        
        function copyToClipboard() {
            const output = document.getElementById('mappingOutput');
            navigator.clipboard.writeText(output.textContent).then(() => {
                alert('代码已复制到剪贴板！');
            }).catch(err => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = output.textContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('代码已复制到剪贴板！');
            });
        }
        
        // ==================== 辅助函数 ====================
        function handleImageError(img) {
            img.style.display = 'none';
            const overlay = document.getElementById('gridOverlay');
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'width: 512px; height: 512px; background: #333; color: #f00; display: flex; align-items: center; justify-content: center;';
            errorDiv.textContent = '图片加载失败: ' + img.src;
            overlay.appendChild(errorDiv);
        }
        
        function assignSelectedToTile() {
            if (!selectedCell) {
                alert('请先选择一个网格位置');
                return;
            }
            
            // 显示牌选择对话框
            const tileKeys = allTiles.map(t => t.key);
            const selectedKey = prompt(`请输入要分配的牌键名（如 tong1, wan5 等）:\n可用: ${tileKeys.slice(0, 10).join(', ')}...`);
            
            if (selectedKey && tileKeys.includes(selectedKey)) {
                tileMapping[selectedKey] = [...selectedCell];
                highlightMappedCells();
                testAllTiles();
                generateMapping();
                alert(`已将位置 [${selectedCell[0]}, ${selectedCell[1]}] 分配给 ${selectedKey}`);
            } else if (selectedKey) {
                alert('无效的牌键名');
            }
        }
        
        function clearMapping() {
            if (confirm('确定要清空所有映射吗？')) {
                tileMapping = {};
                highlightMappedCells();
                testAllTiles();
                generateMapping();
            }
        }
        
        // ==================== 初始化 ====================
        // 初始化输入框默认值
        document.getElementById('cols').value = SPRITE_CONFIG.cols;
        document.getElementById('rows').value = SPRITE_CONFIG.rows;
        
        // 初始化网格
        updateGrid();
        
        // 初始化时生成映射代码
        generateMapping();
    </script>
</body>
</html>
